<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - História de Pernambuco</title>
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <img src="assets/logo-removebg-preview.png" alt="Logo" class="logo">
            <h1>Chatbot - História de Pernambuco</h1>
            <p>Aprenda sobre o passado pernambucano de forma interativa</p>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="bot-message">
                <p>Olá! 👋 Sou o guia histórico virtual. Quer conhecer um fato sobre Pernambuco?</p>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Digite sua pergunta...">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script src="js/chatbot.js"></script>
</body>
</html>
